<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Awareness Simulation</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6fa;
    }

    .card {
      width: 390px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }

    .logo {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #687386;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3dc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .notice {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #fff4d6;
      color: #765800;
      font-size: 13px;
      line-height: 1.5;
    }

    .result {
      display: none;
      text-align: center;
    }

    .warning {
      color: #c62828;
      font-size: 24px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="card" id="loginBox">

    <div class="logo">🔐 Corporate Portal</div>

    <div class="subtitle">
      Session expired. Sign in to continue.
    </div>

    <form id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="employee@company.com"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">Sign In</button>

    </form>

    <div class="notice">
      Security Awareness Training Environment
    </div>

  </div>


  <div class="card result" id="resultBox">

    <div class="warning">⚠️</div>

    <h2>Phishing Simulation Detected</h2>

    <p>
      This was a controlled cybersecurity awareness simulation.
    </p>

    <p>
      <strong>No password was stored or transmitted.</strong>
    </p>

    <p>
      Always verify the website address before entering credentials.
    </p>

  </div>


  <script>

    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      /*
        IMPORTANT:
        The password is deliberately NOT collected,
        stored, logged, or transmitted anywhere.
      */

      document.getElementById("loginBox").style.display = "none";
      document.getElementById("resultBox").style.display = "block";

    });

  </script>

</body>
</html>
